apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wmcasino-service.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "WMTF",
        "IntervalMinutes": 15,
        "IntervalMinutesMax": 30,
        "IntervalMinutesMinimum": 1,
        "LockMinute": 13
      },
      "GameRecord": {
         "GameCommandClientBaseUrl": "http://game-gamecommand/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-wmcasino-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
