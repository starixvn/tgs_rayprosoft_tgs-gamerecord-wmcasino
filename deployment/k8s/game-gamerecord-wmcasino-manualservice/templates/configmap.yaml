apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wmcasino-manualservice.name" . }}
  labels:
    {{- include "game-gamerecord-wmcasino-manualservice.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "WMTF",
        "MinIntervalMinute": 5,
        "MaxIntervalMinute": 30,
        "IntervalMinute": 5
        "LockMinute": 4,
        "MongoDefine":  "gp.gamerecord.database.manual",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.manual.wmtf"        
      },
      "NatsSetting": {
        "Queue": "gp.gamerecord.manual",
        "Subject": "gp.gamerecord.manual.wmtf"
      },
      "GameRecord": {
         "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-wmcasino-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
