variables:
  ImageServiceName: pgtgs/game-gamerecord-wmcasino-service
  SettingServiceKey: game-gamerecord-wmcasino-service
  HelmTemplateFolderServiceName: game-gamerecord-wmcasino-service

  ImageManualName: pgtgs/game-gamerecord-wmcasino-manualservice
  SettingManualKey: game-gamerecord-wmcasino-manualservice
  HelmTemplateFolderManualName: game-gamerecord-wmcasino-manualservice
  BuildCacheKey: Tgs.GameRecord.WMCasinoService.$CI_PIPELINE_ID

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-manual-dev
  - deploy-staging
  - deploy-manual-staging
  - deploy-prod
  - deploy-manual-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

unit-test:
  stage: test
  variables:
    DOTNET_USE_POLLING_FILE_WATCHER: "true"
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  script:
    - dotnet build "Tgs.GameRecord.WMCasinoService/Tgs.GameRecord.WMCasinoService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageServiceName:$Tag" --no-restore
    - docker push $ImageServiceName:$Tag
    - dotnet build "Tgs.GameRecord.WMCasinoManualService/Tgs.GameRecord.WMCasinoManualService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageManualName:$Tag" --no-restore
    - docker push $ImageManualName:$Tag

push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderServiceName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageServiceName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderServiceName/values.yaml
    - cp -R deployment/k8s/$HelmTemplateFolderManualName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageManualName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderManualName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$SettingServiceKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$SettingServiceKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderServiceName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderServiceName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF

